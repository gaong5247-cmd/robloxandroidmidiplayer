name: Android Build and Preview Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build universal debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RobloxMIDI-Android-v0.2.0-UHID-preview.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxMIDI-Android-UHID-debug
          path: RobloxMIDI-Android-v0.2.0-UHID-preview.apk
          if-no-files-found: error
      - name: Publish preview release only after successful build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.0-UHID-preview"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" RobloxMIDI-Android-v0.2.0-UHID-preview.apk --clobber
          else
            gh release create "$tag" RobloxMIDI-Android-v0.2.0-UHID-preview.apk \
              --target "$GITHUB_SHA" --title "Roblox MIDI Android v0.2.0 UHID Preview" \
              --prerelease --notes-file RELEASE_NOTES.md
          fi
